# 随机端口，避免本地验证时端口冲突
server.port=0

# 可接受的最大迟到时间窗（事件时间，毫秒）
market-data.max-out-of-order-millis=5000
# 仅追加事件日志路径（重启重放恢复依据）
market-data.journal-path=${java.io.tmpdir}/market-data-journal.jsonl
# 已知标的白名单
market-data.symbols[0]=BTC-USD
market-data.symbols[1]=ETH-USD
market-data.symbols[2]=SOL-USD
market-data.symbols[3]=XRP-USD
market-data.symbols[4]=ADA-USD
market-data.symbols[5]=DOGE-USD
market-data.symbols[6]=DOT-USD
market-data.symbols[7]=MATIC-USD
market-data.symbols[8]=LTC-USD
